<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d14"/>
      <stop offset="50%" stop-color="#0b111a"/>
      <stop offset="100%" stop-color="#101726"/>
    </linearGradient>
    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.18"/>
      <stop offset="40%" stop-color="#1f75cb" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#090d14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dragon-glow" cx="50%" cy="45%" r="35%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dragon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="60%" stop-color="#1f75cb"/>
      <stop offset="100%" stop-color="#0052a3"/>
    </linearGradient>
    <linearGradient id="wing-grad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#38efff"/>
      <stop offset="50%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#104a8e"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#8fd4ff" stop-opacity="0.85"/>
    </linearGradient>
    <pattern id="cyber-grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#00e5ff" stroke-width="0.75" stroke-opacity="0.05"/>
      <circle cx="60" cy="0" r="1.5" fill="#00e5ff" fill-opacity="0.1"/>
    </pattern>
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="20" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg-grad)"/>
  <rect width="1920" height="1080" fill="url(#cyber-grid)"/>
  <circle cx="960" cy="480" r="600" fill="url(#center-glow)"/>
  <circle cx="960" cy="450" r="320" fill="url(#dragon-glow)"/>

  <g opacity="0.15" stroke="#00e5ff" stroke-width="1" fill="none">
    <circle cx="960" cy="450" r="280" stroke-dasharray="4 8"/>
    <circle cx="960" cy="450" r="320" stroke-dasharray="16 16"/>
    <circle cx="960" cy="450" r="360" stroke-opacity="0.5"/>
    <line x1="960" y1="90" x2="960" y2="810" stroke-dasharray="6 6"/>
    <line x1="600" y1="450" x2="1320" y2="450" stroke-dasharray="6 6"/>
  </g>

  <g transform="translate(960, 430) scale(1.15)" filter="url(#neon-glow)">
    <path d="M-6 195 C-42 165 -92 108 -88 45 C-85 -3 -58 -46 -24 -78 C-2 -99 15 -124 20 -155 C22 -170 19 -186 11 -198 C18 -193 28 -184 32 -171 C38 -150 28 -128 12 -108 C-10 -79 -36 -46 -38 0 C-41 42 -12 85 18 108 C42 126 62 152 64 182 C65 197 59 211 48 221 C41 211 40 197 45 186 C51 170 42 153 28 143 C1 123 -18 92 -18 56 C-18 25 -3 -2 18 -21 C37 -38 52 -60 56 -86 C58 -98 56 -112 49 -122 C56 -116 63 -105 64 -92 C67 -72 55 -52 40 -37 C22 -19 9 4 9 29 C9 58 24 81 44 98 C66 117 78 143 76 172 C74 198 60 220 40 234 C25 244 5 247 -14 242 C-45 233 -72 210 -88 183 C-72 195 -50 199 -31 195 Z" fill="url(#dragon-grad)"/>

    <path d="M-22 -85 C-52 -112 -104 -128 -148 -118 C-178 -111 -204 -93 -224 -68 C-202 -72 -178 -67 -160 -54 C-140 -39 -128 -17 -122 7 C-139 0 -158 -2 -176 3 C-156 18 -130 25 -106 21 C-85 18 -68 5 -54 -11 C-38 -30 -26 -57 -22 -85 Z" fill="url(#wing-grad)"/>
    <path d="M-115 -62 C-145 -78 -182 -79 -214 -64 C-192 -60 -172 -47 -160 -29 C-146 -9 -141 17 -142 42 C-130 22 -112 7 -91 -3 C-98 -24 -106 -44 -115 -62 Z" fill="url(#dragon-grad)" opacity="0.85"/>
    <path d="M-155 -15 C-188 -18 -222 -8 -248 12 C-228 12 -208 19 -194 33 C-178 49 -170 71 -168 94 C-159 75 -144 60 -126 51 C-133 28 -143 6 -155 -15 Z" fill="url(#wing-grad)" opacity="0.75"/>

    <path d="M22 -180 C26 -200 42 -214 62 -218 C78 -221 95 -215 106 -204 C94 -201 83 -193 77 -182 C72 -173 72 -161 77 -152 C71 -154 64 -158 60 -165 C55 -173 53 -184 46 -191 C39 -190 32 -184 28 -178 Z" fill="url(#dragon-grad)"/>
    <polygon points="76,-183 92,-180 82,-172" fill="#38efff"/>
    <polygon points="58,-164 70,-163 63,-156" fill="#38efff"/>

    <path d="M-72 32 C-88 28 -105 32 -118 42 C-110 47 -100 48 -91 46 C-78 57 -62 64 -45 66 C-53 54 -62 43 -72 32 Z" fill="#00e5ff" opacity="0.9"/>
    <path d="M-52 82 C-68 85 -82 95 -90 108 C-80 109 -71 105 -65 98 C-55 106 -42 110 -28 109 C-35 99 -43 90 -52 82 Z" fill="#00e5ff" opacity="0.85"/>

    <circle cx="68" cy="-196" r="3" fill="#ffffff" filter="url(#soft-glow)"/>
  </g>

  <g transform="translate(960, 830)" text-anchor="middle">
    <text y="0" font-family="'JetBrains Mono', 'Segoe UI', system-ui, -apple-system, monospace" font-size="34" font-weight="800" letter-spacing="14" fill="url(#text-grad)" filter="url(#soft-glow)">KALI LINUX</text>
    <text y="32" font-family="'JetBrains Mono', 'Segoe UI', system-ui, -apple-system, monospace" font-size="12" font-weight="500" letter-spacing="8" fill="#00e5ff" opacity="0.65">THE QUIETER YOU BECOME, THE MORE YOU ARE ABLE TO HEAR</text>
    <line x1="-180" y1="52" x2="180" y2="52" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.3"/>
    <circle cx="0" cy="52" r="3" fill="#00e5ff" fill-opacity="0.8"/>
    <circle cx="-180" cy="52" r="2" fill="#00e5ff" fill-opacity="0.5"/>
    <circle cx="180" cy="52" r="2" fill="#00e5ff" fill-opacity="0.5"/>
  </g>
</svg>
